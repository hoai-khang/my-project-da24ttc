<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Bộ Sưu Tập Áo Đấu Real Madrid</title>
    <meta charset="utf-8">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <script src="../js/lib.js"></script>
</head>
<body>
    <div class="container" style="margin-top: 30px;">
        <div class="product-list row" id="product-list">
            
        </div>
    </div>

    <script>
        // Vòng lặp duyệt qua mảng productList để tự động xuất 10 bông hoa ra web
        for(let i = 0; i < productList.length; i++)
        {
            addProduct(
                productList[i].id, 
                productList[i].name, 
                productList[i].price, 
                productList[i].image, 
                productList[i].productLink
            );
        }
    </script>
</body>
